name: DNS check (тимчасово)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for d in cyber-kyiv.online svitlo-kyiv.online; do
            echo "== cert $d"; echo | openssl s_client -connect $d:443 -servername $d 2>/dev/null | openssl x509 -noout -subject -dates 2>/dev/null || true
            echo "== https $d: $(curl -sS -m 20 -o /dev/null -w '%{http_code}' https://$d/ 2>&1)"
            echo "== http $d: $(curl -sS -m 20 -o /dev/null -w '%{http_code} %{redirect_url}' http://$d/ 2>&1)"
          done
