name: DNS check (тимчасово)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for d in cyber-kyiv.online www.cyber-kyiv.online; do
            for r in 8.8.8.8 1.1.1.1 9.9.9.9 208.67.222.222 ns10.uadns.com ns11.uadns.com; do
              echo "$d @$r: $(dig +noall +answer A $d @$r | awk '{print $2, $4, $5}' | tr '\n' ' ')"
            done
          done
          dig +noall +answer SOA cyber-kyiv.online @ns10.uadns.com
          echo "== http"; curl -sS -m 20 -o /dev/null -w "%{http_code}\n" -H "Host: cyber-kyiv.online" http://185.199.108.153/
